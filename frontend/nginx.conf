server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html.
    # (La app usa HashRouter, así que esto es más red de seguridad que
    # requisito estricto, pero no estorba.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend NestJS por la red interna de Docker Compose.
    # El backend ya expone sus rutas bajo /api, así que se reenvía tal cual.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash en el nombre -> cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
