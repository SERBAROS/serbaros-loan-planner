server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html.
    # (La app usa HashRouter, así que esto es más red de seguridad que
    # requisito estricto, pero no estorba.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre -> cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
