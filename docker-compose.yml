services:
  mariadb:
    image: mariadb:11
    container_name: loan-planner-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-serbaros_loan_planner}
      MARIADB_USER: ${DB_USERNAME:-serbaros_loan_planner}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: loan-planner-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-serbaros_loan_planner}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_DATABASE: ${DB_DATABASE:-serbaros_loan_planner}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: loan-planner-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  db-data:
